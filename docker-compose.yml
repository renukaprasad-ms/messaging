services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: messaging-frontend
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    depends_on:
      - backend
    networks:
      - messaging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messaging-backend
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    environment:
      SERVER_PORT: ${BACKEND_CONTAINER_PORT}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${POSTGRES_CONTAINER_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      APP_DATASOURCE_WRITE_URL: ${APP_DATASOURCE_WRITE_URL}
      APP_DATASOURCE_WRITE_USERNAME: ${APP_DATASOURCE_WRITE_USERNAME}
      APP_DATASOURCE_WRITE_PASSWORD: ${APP_DATASOURCE_WRITE_PASSWORD}
      APP_DATASOURCE_WRITE_MAX_POOL_SIZE: ${APP_DATASOURCE_WRITE_MAX_POOL_SIZE}
      APP_DATASOURCE_WRITE_MIN_IDLE: ${APP_DATASOURCE_WRITE_MIN_IDLE}
      APP_DATASOURCE_READ_URL: ${APP_DATASOURCE_READ_URL}
      APP_DATASOURCE_READ_USERNAME: ${APP_DATASOURCE_READ_USERNAME}
      APP_DATASOURCE_READ_PASSWORD: ${APP_DATASOURCE_READ_PASSWORD}
      APP_DATASOURCE_READ_MAX_POOL_SIZE: ${APP_DATASOURCE_READ_MAX_POOL_SIZE}
      APP_DATASOURCE_READ_MIN_IDLE: ${APP_DATASOURCE_READ_MIN_IDLE}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${REDIS_CONTAINER_PORT}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_CONTAINER_PORT}
      APP_KAFKA_QUEUE_CRITICAL_TOPIC: ${APP_KAFKA_QUEUE_CRITICAL_TOPIC}
      APP_KAFKA_QUEUE_CRITICAL_PARTITIONS: ${APP_KAFKA_QUEUE_CRITICAL_PARTITIONS}
      APP_KAFKA_QUEUE_CRITICAL_REPLICAS: ${APP_KAFKA_QUEUE_CRITICAL_REPLICAS}
      APP_KAFKA_QUEUE_HIGH_TOPIC: ${APP_KAFKA_QUEUE_HIGH_TOPIC}
      APP_KAFKA_QUEUE_HIGH_PARTITIONS: ${APP_KAFKA_QUEUE_HIGH_PARTITIONS}
      APP_KAFKA_QUEUE_HIGH_REPLICAS: ${APP_KAFKA_QUEUE_HIGH_REPLICAS}
      APP_KAFKA_QUEUE_MEDIUM_TOPIC: ${APP_KAFKA_QUEUE_MEDIUM_TOPIC}
      APP_KAFKA_QUEUE_MEDIUM_PARTITIONS: ${APP_KAFKA_QUEUE_MEDIUM_PARTITIONS}
      APP_KAFKA_QUEUE_MEDIUM_REPLICAS: ${APP_KAFKA_QUEUE_MEDIUM_REPLICAS}
      APP_KAFKA_QUEUE_LOW_TOPIC: ${APP_KAFKA_QUEUE_LOW_TOPIC}
      APP_KAFKA_QUEUE_LOW_PARTITIONS: ${APP_KAFKA_QUEUE_LOW_PARTITIONS}
      APP_KAFKA_QUEUE_LOW_REPLICAS: ${APP_KAFKA_QUEUE_LOW_REPLICAS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE}
      SMTP_FROM: ${SMTP_FROM}
      OTP_EMAIL_SUBJECT: ${OTP_EMAIL_SUBJECT}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_ACCESS_COOKIE_NAME: ${JWT_ACCESS_COOKIE_NAME}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME}
      JWT_ACCESS_COOKIE_MAX_AGE: ${JWT_ACCESS_COOKIE_MAX_AGE}
      JWT_REFRESH_COOKIE_MAX_AGE: ${JWT_REFRESH_COOKIE_MAX_AGE}
      JWT_COOKIE_PATH: ${JWT_COOKIE_PATH}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN}
      JWT_COOKIE_HTTP_ONLY: ${JWT_COOKIE_HTTP_ONLY}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE}
      OTP_TTL: ${OTP_TTL}
      OTP_RESEND_COOLDOWN: ${OTP_RESEND_COOLDOWN}
      OTP_LENGTH: ${OTP_LENGTH}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - messaging

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: messaging-postgres
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_CONTAINER_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging

  redis:
    image: ${REDIS_IMAGE}
    container_name: messaging-redis
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_CONTAINER_PORT}"
    command: ["redis-server", "--port", "${REDIS_CONTAINER_PORT}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_CONTAINER_PORT} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging

  kafka:
    image: ${KAFKA_IMAGE}
    container_name: messaging-kafka
    ports:
      - "${KAFKA_HOST_PORT}:${KAFKA_CONTAINER_PORT}"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_CONTAINER_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_CONTAINER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:${KAFKA_CONTAINER_PORT} --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - messaging

volumes:
  postgres-data:
  redis-data:
  kafka-data:

networks:
  messaging:
    driver: bridge
