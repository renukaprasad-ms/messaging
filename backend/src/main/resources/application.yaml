spring:
  application:
    name: app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messaging}
    username: ${SPRING_DATASOURCE_USERNAME:messaging}
    password: ${SPRING_DATASOURCE_PASSWORD:messaging}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  auth:
    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:10m}
  notification:
    email:
      from: ${SMTP_FROM:no-reply@messaging.local}
      otp-subject: ${OTP_EMAIL_SUBJECT:Your verification code}
    otp:
      ttl: ${OTP_TTL:5m}
      resend-cooldown: ${OTP_RESEND_COOLDOWN:1m}
      length: ${OTP_LENGTH:6}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
  security:
    jwt:
      issuer: ${JWT_ISSUER:messaging}
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}
      access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
    cookie:
      access-name: ${JWT_ACCESS_COOKIE_NAME:msid}
      refresh-name: ${JWT_REFRESH_COOKIE_NAME:msid_r}
      access-max-age: ${JWT_ACCESS_COOKIE_MAX_AGE:15m}
      refresh-max-age: ${JWT_REFRESH_COOKIE_MAX_AGE:7d}
      path: ${JWT_COOKIE_PATH:/}
      domain: ${JWT_COOKIE_DOMAIN:}
      http-only: ${JWT_COOKIE_HTTP_ONLY:true}
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: ${JWT_COOKIE_SAME_SITE:Strict}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
