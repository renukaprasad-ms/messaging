spring:
  application:
    name: app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messaging}
    username: ${SPRING_DATASOURCE_USERNAME:messaging}
    password: ${SPRING_DATASOURCE_PASSWORD:messaging}
  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:messaging-notification-workers}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    url: ${APP_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messaging}}
    user: ${APP_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:messaging}}
    password: ${APP_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:messaging}}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

app:
  datasource:
    write:
      jdbc-url: ${APP_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messaging}}
      username: ${APP_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:messaging}}
      password: ${APP_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:messaging}}
      maximum-pool-size: ${APP_DATASOURCE_WRITE_MAX_POOL_SIZE:5}
      minimum-idle: ${APP_DATASOURCE_WRITE_MIN_IDLE:1}
    read:
      jdbc-url: ${APP_DATASOURCE_READ_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messaging}}
      username: ${APP_DATASOURCE_READ_USERNAME:${SPRING_DATASOURCE_USERNAME:messaging}}
      password: ${APP_DATASOURCE_READ_PASSWORD:${SPRING_DATASOURCE_PASSWORD:messaging}}
      maximum-pool-size: ${APP_DATASOURCE_READ_MAX_POOL_SIZE:3}
      minimum-idle: ${APP_DATASOURCE_READ_MIN_IDLE:0}
  kafka:
    queues:
      critical:
        topic: ${APP_KAFKA_QUEUE_CRITICAL_TOPIC:messaging.critical}
        partitions: ${APP_KAFKA_QUEUE_CRITICAL_PARTITIONS:1}
        replicas: ${APP_KAFKA_QUEUE_CRITICAL_REPLICAS:1}
        concurrency: ${APP_KAFKA_QUEUE_CRITICAL_CONCURRENCY:1}
      high:
        topic: ${APP_KAFKA_QUEUE_HIGH_TOPIC:messaging.high}
        partitions: ${APP_KAFKA_QUEUE_HIGH_PARTITIONS:1}
        replicas: ${APP_KAFKA_QUEUE_HIGH_REPLICAS:1}
        concurrency: ${APP_KAFKA_QUEUE_HIGH_CONCURRENCY:1}
      medium:
        topic: ${APP_KAFKA_QUEUE_MEDIUM_TOPIC:messaging.medium}
        partitions: ${APP_KAFKA_QUEUE_MEDIUM_PARTITIONS:1}
        replicas: ${APP_KAFKA_QUEUE_MEDIUM_REPLICAS:1}
        concurrency: ${APP_KAFKA_QUEUE_MEDIUM_CONCURRENCY:1}
      low:
        topic: ${APP_KAFKA_QUEUE_LOW_TOPIC:messaging.low}
        partitions: ${APP_KAFKA_QUEUE_LOW_PARTITIONS:1}
        replicas: ${APP_KAFKA_QUEUE_LOW_REPLICAS:1}
        concurrency: ${APP_KAFKA_QUEUE_LOW_CONCURRENCY:1}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5100}
  auth:
    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:10m}
  notification:
    async: ${APP_NOTIFICATION_ASYNC:false}
    email:
      from: ${SMTP_FROM:no-reply@messaging.local}
      otp-subject: ${OTP_EMAIL_SUBJECT:Your verification code}
    otp:
      ttl: ${OTP_TTL:5m}
      resend-cooldown: ${OTP_RESEND_COOLDOWN:1m}
      length: ${OTP_LENGTH:6}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
  media:
    storage:
      provider: supabase
      endpoint: ${SUPABASE_STORAGE_S3_ENDPOINT:}
      access-key: ${SUPABASE_STORAGE_ACCESS_KEY:}
      secret-key: ${SUPABASE_STORAGE_SECRET_KEY:}
      region: ${SUPABASE_STORAGE_REGION:us-east-1}
      public-base-url: ${SUPABASE_STORAGE_PUBLIC_BASE_URL:}
      bucket: ${SUPABASE_STORAGE_BUCKET:messaging-assets}
      signed-upload-ttl: ${MEDIA_SIGNED_UPLOAD_TTL:2h}
      max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:5242880}
  security:
    jwt:
      issuer: ${JWT_ISSUER:messaging}
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}
      access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
    cookie:
      access-name: ${JWT_ACCESS_COOKIE_NAME:msid}
      refresh-name: ${JWT_REFRESH_COOKIE_NAME:msid_r}
      access-max-age: ${JWT_ACCESS_COOKIE_MAX_AGE:15m}
      refresh-max-age: ${JWT_REFRESH_COOKIE_MAX_AGE:7d}
      path: ${JWT_COOKIE_PATH:/}
      domain: ${JWT_COOKIE_DOMAIN:}
      http-only: ${JWT_COOKIE_HTTP_ONLY:true}
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: ${JWT_COOKIE_SAME_SITE:Strict}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.apache.kafka: warn
    org.springframework.kafka: warn

server:
  tomcat:
    threads:
      max: 25
      min-spare: 2
    max-connections: 200
    accept-count: 50
