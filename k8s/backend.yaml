apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-backend
spec:
  replicas: 1
  # Stop the previous pod before starting its replacement during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: messaging-backend
  template:
    metadata:
      labels:
        app: messaging-backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: messaging-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: messaging-backend-config
            - secretRef:
                name: messaging-backend-secrets
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 20s
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # TCP checks avoid restarting the JVM just because a dependency is down.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-backend
spec:
  type: ClusterIP
  selector:
    app: messaging-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
